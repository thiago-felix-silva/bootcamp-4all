<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Alana | Entrar</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- O mesmo topo do contato.html: o layout.js liga o 🌙 e o ☰ -->
  <header class="topo">
    <a class="logo" href="index.html">alana.dev</a>
    <nav>
      <a href="index.html#sobre">Sobre</a>
      <a href="index.html#skills">Skills</a>
      <a href="index.html#projetos">Projetos</a>
      <a href="contato.html">Contato</a>
      <button class="botao-tema" aria-label="Alternar modo escuro">🌙</button>
    </nav>
    <button class="botao-menu" aria-label="Abrir menu" aria-expanded="false">☰</button>
  </header>

  <!-- contato-pagina: a mesma arrumação da página de contato
       (título centralizado e o formulário no meio) -->
  <main class="container contato-pagina">
    <h1>Entrar</h1>
    <p>Conta de teste: usuário <strong>aluno</strong> · senha <strong>bootcamp2026</strong></p>

    <!-- Os mesmos ids do login da aula 4: o login.js funciona igual -->
    <form class="formulario" id="form-login" novalidate>
      <div class="campo">
        <label for="usuario">Usuário</label>
        <input type="text" id="usuario" name="usuario" placeholder="Digite seu usuário">
      </div>
      <div class="campo">
        <label for="senha">Senha</label>
        <input type="password" id="senha" name="senha" placeholder="Digite sua senha">
      </div>
      <button type="submit" class="botao">Entrar</button>
      <p class="aviso" id="aviso" aria-live="polite"></p>
    </form>
  </main>

  <footer class="rodape">
    <h5>Alana</h5>
    <h6>Feito com HTML e CSS</h6>
  </footer>

  <!-- layout.js: modo escuro e menu do celular (o mesmo do contato).
       login.js: confere a conta e, se der certo, leva para o index.html -->
  <script src="layout.js"></script>
  <script src="login.js"></script>

</body>
</html>
