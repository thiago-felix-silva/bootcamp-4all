<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Alana | Contato</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="topo">
    <a class="logo" href="index.html">alana.dev</a>
    <nav>
      <a href="index.html#sobre">Sobre</a>
      <a href="index.html#skills">Skills</a>
      <a href="index.html#projetos">Projetos</a>
      <a href="contato.html">Contato</a>
      <button class="botao-tema" aria-label="Alternar modo escuro">🌙</button>
    </nav>
    <button class="botao-menu" aria-label="Abrir menu" aria-expanded="false">☰</button>
  </header>

  <main class="container contato-pagina">
    <h1>Vamos conversar</h1>
    <p>Conte um pouco sobre o seu projeto. Todos os campos são obrigatórios.</p>

    <form class="formulario" id="form-contato" novalidate>
      <div class="campo">
        <label for="nome">Nome</label>
        <input type="text" id="nome" name="nome" placeholder="Digite seu nome">
      </div>
      <div class="campo">
        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" placeholder="exemplo@email.com">
      </div>
      <div class="campo">
        <label for="assunto">Assunto</label>
        <select id="assunto" name="assunto">
          <option value="">Escolha um assunto</option>
          <option value="projeto">Quero contratar um projeto</option>
          <option value="duvida">Tenho uma dúvida</option>
          <option value="outro">Outro assunto</option>
        </select>
      </div>
      <div class="campo">
        <label for="mensagem">Mensagem</label>
        <textarea id="mensagem" name="mensagem" rows="5" placeholder="Digite sua mensagem"></textarea>
      </div>
      <button type="submit" class="botao">Enviar mensagem</button>
      <p class="aviso" id="aviso" aria-live="polite"></p>
    </form>
  </main>

  <footer class="rodape">
    <h5>Alana</h5>
    <h6>Feito com HTML e CSS</h6>
  </footer>

  <!-- Esta página não usa o script.js (ele é só da home).
       O layout.js liga o modo escuro e o menu do celular.
       O contato.js confere o formulário (aula 4). -->
  <script src="layout.js"></script>
  <script src="contato.js"></script>

</body>
</html>
